name: Database CI

on:
  pull_request:
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  detect-app:
    name: detect-app
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json ausente — scripts/db/{test-rollback,assert-rls-enabled,assert-invariants}.ts são Fase 1 (ver docs/08-PLANO-DE-IMPLEMENTACAO/02-FASE-1-APP-FUNCIONAL.md). Este workflow passa a aplicar e testar as migrations de verdade assim que a Fase 1 adicionar o toolchain Node."
          fi

  migrations:
    name: migrations
    needs: detect-app
    if: needs.detect-app.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir stack local
        run: supabase start

      - name: Aplicar migrations do zero
        run: supabase db reset

      # ★ Migration que não reverte é migration perigosa.
      - name: Testar reversão das migrations
        run: pnpm tsx scripts/db/test-rollback.ts

      - name: Testes de RLS (inclui casos de NEGAÇÃO)
        run: supabase test db

      # ★ Nenhuma tabela exposta pode ficar sem RLS.
      - name: Verificar RLS habilitada em toda tabela exposta
        run: pnpm tsx scripts/db/assert-rls-enabled.ts

      # ★ Invariantes estruturais, incluindo approvals_must_be_human.
      - name: Verificar invariantes de banco
        run: pnpm tsx scripts/db/assert-invariants.ts
