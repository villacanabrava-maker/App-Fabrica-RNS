name: Database CI

on:
  pull_request:
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ★ Estes três passos não dependem de Node/pnpm — só da CLI do
      # Supabase — e por isso rodam sempre, mesmo antes da Fase 1
      # trazer o toolchain da aplicação. São eles que validam de
      # verdade as migrations e as policies de RLS que este repositório
      # já contém; gatear o job inteiro atrás de package.json deixava
      # este check verde sem checar nada.
      - name: Subir stack local
        run: supabase start

      - name: Aplicar migrations do zero
        run: supabase db reset

      - name: Testes de RLS (inclui casos de NEGAÇÃO)
        run: supabase test db

      - name: Verificar se há toolchain Node para os scripts adicionais
        id: guard
        run: |
          # package.json sozinho não basta: package.json existe desde o
          # Sprint 1.1 (Fase 1), mas os scripts/db/*.ts abaixo nunca foram
          # escritos — checar só package.json fazia este guard achar que
          # existiam e quebrar com ERR_MODULE_NOT_FOUND. Mesma classe de
          # bug já corrigida em intelligence-ci.yml: checar os arquivos
          # específicos, não um proxy que parou de significar a mesma coisa.
          if [ -f package.json ] && [ -f scripts/db/test-rollback.ts ] && [ -f scripts/db/assert-rls-enabled.ts ] && [ -f scripts/db/assert-invariants.ts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/db/{test-rollback,assert-rls-enabled,assert-invariants}.ts ainda não existem. As migrations e supabase test db acima já rodaram de verdade; estes scripts adicionais entram quando forem escritos."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.exists == 'true'

      # ★ Migration que não reverte é migration perigosa.
      - name: Testar reversão das migrations
        if: steps.guard.outputs.exists == 'true'
        run: pnpm tsx scripts/db/test-rollback.ts

      # ★ Nenhuma tabela exposta pode ficar sem RLS.
      - name: Verificar RLS habilitada em toda tabela exposta
        if: steps.guard.outputs.exists == 'true'
        run: pnpm tsx scripts/db/assert-rls-enabled.ts

      # ★ Invariantes estruturais, incluindo approvals_must_be_human.
      - name: Verificar invariantes de banco
        if: steps.guard.outputs.exists == 'true'
        run: pnpm tsx scripts/db/assert-invariants.ts
