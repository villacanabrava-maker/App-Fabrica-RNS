name: Human Telegram Notifications

on:
  pull_request_target:
    types: [opened, ready_for_review, review_requested]
  workflow_run:
    workflows: ["Application CI", "Database CI", "Security", "Intelligence CI", "Fiscal Bridge"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-pr:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Notificar acao humana
        env:
          BRIDGE_URL: ${{ secrets.FISCAL_BRIDGE_URL }}
          BRIDGE_SECRET: ${{ secrets.FISCAL_BRIDGE_SECRET }}
          EVENT_KEY: pr-${{ github.event.pull_request.number }}-${{ github.event.action }}-${{ github.event.pull_request.head.sha }}
          TITLE: PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$BRIDGE_URL" || { echo "::error::FISCAL_BRIDGE_URL ausente"; exit 1; }
          test -n "$BRIDGE_SECRET" || { echo "::error::FISCAL_BRIDGE_SECRET ausente"; exit 1; }

          # human_action=REVIEW: revisar/aprovar uma PR e uma decisao que exige autoridade humana
          # (item 2 da politica); isto nao e um evento operacional de rotina.
          SUMMARY="Evento: $ACTION. Autor/agente: $AUTHOR. Revise a PR no GitHub quando puder."

          jq -nc \
            --arg event_key "$EVENT_KEY" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            --arg url "$URL" \
            --arg sha "$SHA" \
            --argjson pr_number "$PR_NUMBER" \
            '{event_key:$event_key,category:"HUMAN_ACTION",severity:"info",human_action:"REVIEW",
              title:$title,human_summary:$summary,url:$url,checks_url:($url+"/checks"),sha:$sha,pr_number:$pr_number,
              next_step:"Abra a PR e revise quando conveniente; aprovacao e merge continuam exclusivamente humanos."}' \
            > payload.json

          curl --fail-with-body --silent --show-error \
            -X POST "$BRIDGE_URL/api/notify-telegram" \
            -H "Authorization: Bearer $BRIDGE_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json

  notify-workflow:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Notificar conclusao de workflow
        env:
          BRIDGE_URL: ${{ secrets.FISCAL_BRIDGE_URL }}
          BRIDGE_SECRET: ${{ secrets.FISCAL_BRIDGE_SECRET }}
          EVENT_KEY: workflow-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          test -n "$BRIDGE_URL" || { echo "::error::FISCAL_BRIDGE_URL ausente"; exit 1; }
          test -n "$BRIDGE_SECRET" || { echo "::error::FISCAL_BRIDGE_SECRET ausente"; exit 1; }

          SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"

          # Agrupamento server-side (tabela nova) foi explicitamente removido do escopo desta versao.
          # Cada workflow ainda notifica individualmente; uma falha critica notifica imediatamente
          # (abaixo). O endpoint faz um dedupe best-effort em memoria por event_key (sem persistencia).
          if [ "$CONCLUSION" = "success" ]; then
            CATEGORY="INFO"; HUMAN_ACTION="NONE"
            SUMMARY="Workflow $WORKFLOW concluido com sucesso."
          else
            CATEGORY="BLOCKED"; HUMAN_ACTION="INVESTIGATE"
            SUMMARY="Workflow $WORKFLOW terminou sem sucesso. A Fabrica pode continuar operando; esta falha merece um olhar."
          fi

          jq -nc \
            --arg event_key "$EVENT_KEY" \
            --arg title "Fabrica RNS — $WORKFLOW" \
            --arg summary "$SUMMARY" \
            --arg url "$URL" \
            --arg category "$CATEGORY" \
            --arg human_action "$HUMAN_ACTION" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --arg short_sha "$SHORT_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg workflow "$WORKFLOW" \
            '{event_key:$event_key,category:$category,severity:(if $conclusion == "success" then "info" else "critical" end),
              human_action:$human_action,title:$title,human_summary:$summary,url:$url,checks_url:$url,branch:$branch,sha:$sha,
              checks:[($workflow+": "+$conclusion)],technical_detail:("conclusion="+$conclusion),
              next_step:(if $conclusion == "success" then "Nenhuma acao; acompanhamento de rotina." else "Abra o workflow no GitHub e investigue a causa." end)}' \
            > payload.json

          curl --fail-with-body --silent --show-error \
            -X POST "$BRIDGE_URL/api/notify-telegram" \
            -H "Authorization: Bearer $BRIDGE_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
