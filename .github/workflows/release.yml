name: Release Checks

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  detect-app:
    name: detect-app
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json ausente — a Fase 1 (app funcional) ainda não foi implementada, ver docs/08-PLANO-DE-IMPLEMENTACAO/02-FASE-1-APP-FUNCIONAL.md. Nada em produção ainda para verificar."
          fi

  production-checks:
    name: production-checks
    needs: detect-app
    if: needs.detect-app.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Smoke tests de produção
        run: pnpm test:smoke

      - name: E2E do caminho crítico
        run: pnpm test:e2e:critical

      - name: Verificação final de segurança
        run: pnpm test:security

      - name: Verificação de migration em produção
        run: pnpm tsx scripts/db/verify-production-migration.ts

      # Estes são os Deployment Checks configurados no Vercel.
      # Enquanto não passarem, o build de produção existe
      # mas NÃO recebe usuários.
      - name: Reportar status ao Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - control-plane: release-checks'
