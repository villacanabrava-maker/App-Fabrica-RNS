name: Intelligence CI

on:
  pull_request:
    paths:
      - 'factory-intelligence/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/intelligence/**'

permissions:
  contents: read

jobs:
  detect-app:
    name: detect-app
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          # package.json sozinho não basta: este job precisa também dos
          # scripts de scripts/intelligence/, que são entregáveis da Fase 0
          # (docs/08-PLANO-DE-IMPLEMENTACAO/01-PLANO-MESTRE-DE-IMPLEMENTACAO.md
          # §3) ainda não construídos, mesmo já com package.json na raiz
          # (Fase 1, Sprint 1.1).
          if [ -f package.json ] && [ -f scripts/intelligence/validate-schemas.ts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/intelligence/ ainda não existe — é entregável da Fase 0, ver docs/08-PLANO-DE-IMPLEMENTACAO/01-PLANO-MESTRE-DE-IMPLEMENTACAO.md §3. Este workflow passa a validar de verdade assim que esses scripts forem escritos."
          fi

  validate:
    name: validate
    needs: detect-app
    if: needs.detect-app.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validar JSON Schemas
        run: pnpm tsx scripts/intelligence/validate-schemas.ts

      - name: Validar registries YAML
        run: pnpm tsx scripts/intelligence/validate-registry.ts

      - name: Reconstruir projeções
        run: pnpm tsx scripts/intelligence/build-projections.ts

      # ★ O coração deste workflow.
      # Falha se alguém editou .agents/skills ou .claude/skills à mão,
      # ou se a projeção divergiu da fonte canônica.
      - name: Detectar drift das projeções
        run: pnpm tsx scripts/intelligence/check-drift.ts

      - name: Validar fixtures contra os schemas
        run: pnpm tsx scripts/intelligence/validate-fixtures.ts

      - name: Evals de fumaça das skills alteradas
        run: pnpm tsx scripts/intelligence/run-evals.ts --changed-only
