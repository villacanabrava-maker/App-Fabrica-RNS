name: Preview E2E

# ★ NÃO dispara em pull_request.
# Espera o Orchestrator confirmar que o preview pair está pronto
# (Supabase preview branch E Vercel preview deployment).
# Rodar antes disso produz falha intermitente.
on:
  repository_dispatch:
    types: [rns.preview_pair_ready]

permissions:
  contents: read
  statuses: write

jobs:
  detect-app:
    name: detect-app
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.head_sha }}
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json ausente — este evento não deveria ter sido disparado antes da Fase 1 (app funcional) existir. Ver docs/08-PLANO-DE-IMPLEMENTACAO/02-FASE-1-APP-FUNCIONAL.md."
          fi

  e2e:
    name: e2e
    needs: detect-app
    if: needs.detect-app.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.head_sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E contra o preview
        env:
          PREVIEW_URL: ${{ github.event.client_payload.preview_url }}
          SUPABASE_BRANCH: ${{ github.event.client_payload.supabase_branch }}
        run: pnpm test:e2e

      - name: Acessibilidade no preview
        env:
          PREVIEW_URL: ${{ github.event.client_payload.preview_url }}
        run: pnpm test:a11y

      # ★ Nome ÚNICO do check, incluindo o ambiente.
      # Nomes duplicados entre workflows colidem e causam
      # promoção intermitente no Vercel.
      - name: Reportar status ao Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - control-plane: preview-e2e'
